<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />

  <title>會考問 AI</title>

  <meta
    name="app-version"
    content="2026.08.20-1610-conversation"
  />

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>

    :root {
      --primary: #07966c;
      --primary-dark: #067a59;

      --background: #f3f6fb;
      --card: #ffffff;

      --text: #172033;
      --muted: #667085;

      --border: #d9e0ea;

      --user-bubble: #dcf7ec;
      --ai-bubble: #ffffff;

      --soft-green: #edf9f5;

      --danger: #c62828;

      --warning-bg: #fff7ed;
      --warning-border: #fed7aa;
      --warning-text: #9a3412;
    }


    * {
      box-sizing: border-box;
      -webkit-text-size-adjust: 100%;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }


    body {
      background: var(--background);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang TC",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    }


    .page {
      width: 100%;
      max-width: 760px;
      min-height: 100vh;
      margin: 0 auto;

      padding:
        calc(18px + env(safe-area-inset-top))
        16px
        calc(160px + env(safe-area-inset-bottom));
    }


    /* ============================================================
       HEADER
    ============================================================ */

    .header {
      margin-bottom: 14px;
    }


    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }


    .header-title {
      margin: 0;
      font-size: 25px;
      line-height: 1.3;
      font-weight: 850;
    }


    .new-question-button {
      border: 1px solid #b7ead7;
      border-radius: 999px;

      padding: 8px 13px;

      background: #ffffff;
      color: var(--primary);

      font-size: 13px;
      font-weight: 750;

      cursor: pointer;
    }


    .new-question-button:active {
      transform: scale(0.97);
    }


    .new-question-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }


    .header-subtitle {
      margin-top: 5px;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.5;
      font-weight: 600;
    }


    /* ============================================================
       CONVERSATION BADGE
    ============================================================ */

    .conversation-bar {
      display: none;

      margin-top: 10px;
      padding: 8px 11px;

      background: #eef9f5;

      border: 1px solid #cceee2;
      border-radius: 11px;

      color: #087456;

      font-size: 12px;
      line-height: 1.4;
    }


    .conversation-bar.visible {
      display: block;
    }


    /* ============================================================
       INTRO
    ============================================================ */

    .intro-card {
      margin-bottom: 20px;
      padding: 18px;

      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 18px;

      box-shadow:
        0 6px 20px rgba(30, 50, 80, 0.06);
    }


    .intro-title {
      margin: 0 0 14px;

      font-size: 18px;
      line-height: 1.4;
      font-weight: 800;
    }


    .intro-actions {
      display: grid;
      gap: 10px;
    }


    .intro-action {
      display: flex;
      align-items: center;
      gap: 11px;

      min-height: 46px;
      padding: 10px 12px;

      background: #f7f9fc;

      border: 1px solid #e4e9f0;
      border-radius: 12px;
    }


    .intro-action-icon {
      flex: 0 0 30px;
      font-size: 21px;
      text-align: center;
    }


    .intro-action-text {
      font-size: 15px;
      line-height: 1.45;
      font-weight: 700;
    }


    .subject-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 14px;
    }


    .subject-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 29px;
      padding: 5px 10px;

      background: var(--soft-green);

      border: 1px solid #cceee2;
      border-radius: 999px;

      color: #087456;

      font-size: 13px;
      line-height: 1;
      font-weight: 750;
    }


    .intro-tip {
      margin-top: 13px;
      padding-top: 12px;

      border-top: 1px solid #edf0f4;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.5;
    }


    /* ============================================================
       CHAT
    ============================================================ */

    .chat-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }


    .message-row {
      display: flex;
      width: 100%;
    }


    .message-row.ai {
      justify-content: flex-start;
    }


    .message-row.user {
      justify-content: flex-end;
    }


    .message-row.system {
      justify-content: center;
    }


    .bubble {
      max-width: 84%;

      padding: 12px 14px;

      border-radius: 16px;

      font-size: 15px;
      line-height: 1.65;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }


    .message-row.ai .bubble {
      background: var(--ai-bubble);

      border: 1px solid var(--border);
      border-top-left-radius: 6px;
    }


    .message-row.user .bubble {
      background: var(--user-bubble);

      border: 1px solid #b7ead7;
      border-top-right-radius: 6px;
    }


    .message-row.system .bubble {
      max-width: 100%;
      width: 100%;

      background: var(--warning-bg);

      border: 1px solid var(--warning-border);

      color: var(--warning-text);

      text-align: center;
      font-size: 14px;
    }


    /* ============================================================
       IMAGE MESSAGE
    ============================================================ */

    .message-image {
      display: block;

      width: 100%;
      max-width: 280px;
      max-height: 360px;

      border-radius: 12px;

      object-fit: contain;

      background: #ffffff;
    }


    .image-caption {
      margin-top: 8px;

      font-size: 14px;
      line-height: 1.5;

      color: var(--text);
    }


    /* ============================================================
       THINKING
    ============================================================ */

    .thinking {
      display: inline-flex;
      align-items: center;
      gap: 5px;

      color: var(--muted);
    }


    .thinking-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #98a2b3;

      animation: blink 1.2s infinite;
    }


    .thinking-dot:nth-child(2) {
      animation-delay: 0.2s;
    }


    .thinking-dot:nth-child(3) {
      animation-delay: 0.4s;
    }


    @keyframes blink {

      0%,
      80%,
      100% {
        opacity: 0.25;
      }

      40% {
        opacity: 1;
      }
    }


    /* ============================================================
       STATUS
    ============================================================ */

    .status {
      margin-top: 14px;

      color: #98a2b3;

      font-size: 11px;
      line-height: 1.5;

      text-align: center;
    }


    .status.error {
      color: var(--danger);
      font-weight: 700;
    }


    /* ============================================================
       COMPOSER
    ============================================================ */

    .composer {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 100;

      padding:
        8px
        12px
        calc(9px + env(safe-area-inset-bottom));

      background: rgba(255, 255, 255, 0.97);

      border-top: 1px solid var(--border);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }


    .composer-inner {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }


    /* ============================================================
       IMAGE PREVIEW
    ============================================================ */

    .image-preview-area {
      display: none;

      align-items: flex-start;
      gap: 10px;

      margin-bottom: 8px;
    }


    .image-preview-area.visible {
      display: flex;
    }


    .image-preview-wrap {
      position: relative;

      flex: 0 0 92px;

      width: 92px;
      height: 92px;

      border-radius: 14px;

      overflow: hidden;

      background: #eef1f5;

      border: 1px solid var(--border);
    }


    .image-preview {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }


    .remove-image-button {
      position: absolute;

      top: 5px;
      right: 5px;

      width: 27px;
      height: 27px;

      padding: 0;

      border: 0;
      border-radius: 50%;

      background: rgba(0, 0, 0, 0.72);

      color: #ffffff;

      font-size: 18px;
      line-height: 27px;

      cursor: pointer;
    }


    .remove-image-button:disabled {
      opacity: 0.4;
    }


    .image-meta {
      flex: 1;
      min-width: 0;
      padding-top: 4px;
    }


    .image-meta-title {
      font-size: 13px;
      line-height: 1.4;
      font-weight: 750;
    }


    .image-info {
      margin-top: 5px;

      color: var(--muted);

      font-size: 11px;
      line-height: 1.5;
    }


    .composer-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }


    .image-button {
      flex: 0 0 48px;

      width: 48px;
      height: 48px;

      border: 0;
      border-radius: 14px;

      background: #eef1f5;

      font-size: 21px;

      cursor: pointer;
    }


    .image-button:active {
      transform: scale(0.96);
    }


    .image-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }


    .file-input {
      display: none;
    }


    .input-wrap {
      flex: 1;
    }


    .question-input {
      display: block;

      width: 100%;

      min-height: 48px;
      max-height: 120px;

      padding: 12px 14px;

      resize: none;

      background: #ffffff;

      border: 1.5px solid #b8c3d1;
      border-radius: 14px;

      outline: none;

      color: var(--text);

      font-family: inherit;
      font-size: 16px;
      line-height: 1.4;
    }


    .question-input:focus {
      border-color: var(--primary);
    }


    .question-input::placeholder {
      color: #98a2b3;
    }


    .question-input:disabled {
      background: #eef1f5;
      color: #98a2b3;
      cursor: not-allowed;
    }


    .send-button {
      flex: 0 0 48px;

      width: 48px;
      height: 48px;

      border: 0;
      border-radius: 14px;

      background: var(--primary);

      color: #ffffff;

      font-size: 21px;
      font-weight: 850;

      cursor: pointer;
    }


    .send-button:hover {
      background: var(--primary-dark);
    }


    .send-button:active {
      transform: scale(0.96);
    }


    .send-button:disabled {
      background: #a8b3c5;
      cursor: not-allowed;
    }


    @media (max-width: 480px) {

      .page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .header-title {
        font-size: 24px;
      }

      .intro-card {
        padding: 16px;
      }

      .bubble {
        max-width: 88%;
        font-size: 15px;
      }
    }

  </style>

</head>


<body>


  <main class="page">


    <!-- ========================================================
         HEADER
    ========================================================= -->

    <header class="header">

      <div class="header-top">

        <h1 class="header-title">
          🤖 會考問 AI
        </h1>

        <button
          id="newQuestionButton"
          class="new-question-button"
          type="button"
          disabled
        >
          ＋ 新題
        </button>

      </div>


      <div class="header-subtitle">
        國中 7～9 年級五科專用
      </div>


      <div
        id="conversationBar"
        class="conversation-bar"
      >
        🔗 正在延續同一題，可直接追問。
      </div>

    </header>



    <!-- ========================================================
         INTRO
    ========================================================= -->

    <section
      id="introCard"
      class="intro-card"
    >

      <div class="intro-title">
        有題目就丟給我吧！ 👋
      </div>


      <div class="intro-actions">

        <div class="intro-action">

          <div class="intro-action-icon">
            📷
          </div>

          <div class="intro-action-text">
            拍照或從相簿上傳題目
          </div>

        </div>


        <div class="intro-action">

          <div class="intro-action-icon">
            ⌨️
          </div>

          <div class="intro-action-text">
            直接輸入文字提問
          </div>

        </div>

      </div>


      <div class="subject-list">

        <span class="subject-tag">國文</span>
        <span class="subject-tag">英文</span>
        <span class="subject-tag">數學</span>
        <span class="subject-tag">自然</span>
        <span class="subject-tag">社會</span>

      </div>


      <div class="intro-tip">
        💡 一次問一題，題目拍清楚，我會看得更準。
      </div>

    </section>



    <!-- ========================================================
         CHAT
    ========================================================= -->

    <section
      id="chatArea"
      class="chat-area"
    ></section>


    <div
      id="statusText"
      class="status"
    >
      正在初始化 LIFF……
    </div>


  </main>



  <!-- ==========================================================
       COMPOSER
  =========================================================== -->

  <div class="composer">

    <div class="composer-inner">


      <div
        id="imagePreviewArea"
        class="image-preview-area"
      >

        <div class="image-preview-wrap">

          <img
            id="imagePreview"
            class="image-preview"
            alt="題目圖片預覽"
          />


          <button
            id="removeImageButton"
            class="remove-image-button"
            type="button"
            aria-label="移除圖片"
          >
            ×
          </button>

        </div>


        <div class="image-meta">

          <div class="image-meta-title">
            題目圖片已準備好
          </div>

          <div
            id="imageInfo"
            class="image-info"
          ></div>

        </div>

      </div>



      <div class="composer-row">


        <button
          id="imageButton"
          class="image-button"
          type="button"
          aria-label="拍照或上傳圖片"
          disabled
        >
          📷
        </button>


        <input
          id="fileInput"
          class="file-input"
          type="file"
          accept="image/jpeg,image/png,image/webp"
        />


        <div class="input-wrap">

          <textarea
            id="questionInput"
            class="question-input"
            rows="1"
            maxlength="1200"
            placeholder="正在確認身份……"
            disabled
          ></textarea>

        </div>


        <button
          id="sendButton"
          class="send-button"
          type="button"
          disabled
        >
          ➤
        </button>


      </div>


    </div>

  </div>



  <script>

    "use strict";


    console.log(
      "Ask AI HTML version: 2026.08.20-1610-conversation"
    );


    // ============================================================
    // CONFIG
    // ============================================================

    const LIFF_ID =
      "2011171161-2TM6bcRg";


    const GET_ASK_AI_USER_URL =
      "https://xbitdnrjiqlosfkzegiz.supabase.co/functions/v1/get-ask-ai-user";


    const ASK_AI_URL =
      "https://xbitdnrjiqlosfkzegiz.supabase.co/functions/v1/ask-ai";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_VtPQzTC8Cw-ccxC5bSzIuw_nHVbTO3Q";


    // ============================================================
    // IMAGE SETTINGS
    // ============================================================

    const ALLOWED_IMAGE_TYPES = [
      "image/jpeg",
      "image/png",
      "image/webp",
    ];


    const MAX_ORIGINAL_IMAGE_BYTES =
      12 * 1024 * 1024;


    const MAX_COMPRESSED_IMAGE_BYTES =
      3 * 1024 * 1024;


    const MAX_IMAGE_LONG_SIDE =
      1800;


    const JPEG_QUALITY =
      0.82;


    // ============================================================
    // STATE
    // ============================================================

    let currentUser =
      null;


    let currentIdToken =
      null;


    let requestInProgress =
      false;


    let selectedImage =
      null;


    // 最重要的新状态。
    let currentConversationId =
      null;


    const chatImageUrls =
      [];


    // ============================================================
    // DOM
    // ============================================================

    const introCard =
      document.getElementById(
        "introCard"
      );


    const chatArea =
      document.getElementById(
        "chatArea"
      );


    const questionInput =
      document.getElementById(
        "questionInput"
      );


    const sendButton =
      document.getElementById(
        "sendButton"
      );


    const imageButton =
      document.getElementById(
        "imageButton"
      );


    const fileInput =
      document.getElementById(
        "fileInput"
      );


    const imagePreviewArea =
      document.getElementById(
        "imagePreviewArea"
      );


    const imagePreview =
      document.getElementById(
        "imagePreview"
      );


    const removeImageButton =
      document.getElementById(
        "removeImageButton"
      );


    const imageInfo =
      document.getElementById(
        "imageInfo"
      );


    const statusText =
      document.getElementById(
        "statusText"
      );


    const newQuestionButton =
      document.getElementById(
        "newQuestionButton"
      );


    const conversationBar =
      document.getElementById(
        "conversationBar"
      );


    // ============================================================
    // CONVERSATION UI
    // ============================================================

    function setConversationId(
      conversationId
    ) {

      currentConversationId =
        conversationId || null;


      if (
        currentConversationId
      ) {

        conversationBar.classList.add(
          "visible"
        );


        newQuestionButton.disabled =
          false;


        questionInput.placeholder =
          "繼續追問這一題……";

      } else {

        conversationBar.classList.remove(
          "visible"
        );


        questionInput.placeholder =
          "輸入你的問題……";
      }


      console.log(
        "Current conversation:",
        currentConversationId
      );
    }


    function startNewQuestion(
      showNotice = true
    ) {

      setConversationId(
        null
      );


      clearSelectedImage();


      questionInput.value =
        "";


      if (
        showNotice
      ) {

        addMessage(
          "system",
          "已開始新題，下一個問題會建立新的對話。"
        );
      }


      questionInput.focus();
    }


    // ============================================================
    // UI
    // ============================================================

    function enableComposer() {

      if (
        requestInProgress
      ) {

        return;
      }


      questionInput.disabled =
        false;


      sendButton.disabled =
        false;


      imageButton.disabled =
        false;


      removeImageButton.disabled =
        false;


      newQuestionButton.disabled =
        false;


      if (
        selectedImage
      ) {

        questionInput.placeholder =
          "可以補一句，例如「為什麼 B 不對？」";

      } else if (
        currentConversationId
      ) {

        questionInput.placeholder =
          "繼續追問這一題……";

      } else {

        questionInput.placeholder =
          "輸入你的問題……";
      }
    }


    function disableComposer(
      message
    ) {

      questionInput.disabled =
        true;


      sendButton.disabled =
        true;


      imageButton.disabled =
        true;


      removeImageButton.disabled =
        true;


      newQuestionButton.disabled =
        true;


      questionInput.placeholder =
        message ||
        "目前無法使用";
    }


    function setSendingState(
      sending
    ) {

      requestInProgress =
        sending;


      if (
        sending
      ) {

        disableComposer(
          "AI 正在處理……"
        );


        sendButton.textContent =
          "…";


        return;
      }


      sendButton.textContent =
        "➤";


      enableComposer();


      questionInput.focus();
    }


    function showStatus(
      message,
      isError = false
    ) {

      statusText.textContent =
        message;


      statusText.classList.toggle(
        "error",
        isError
      );
    }


    function restoreConnectedStatus() {

      if (
        !currentUser
      ) {

        return;
      }


      const roleText =
        currentUser.role ===
        "teacher"
          ? "老師"
          : "學生";


      const displayName =
        currentUser.nickname ||
        currentUser.full_name ||
        "使用者";


      showStatus(
        `LIFF 已連線｜${roleText}：${displayName}`
      );
    }


    // ============================================================
    // CHAT
    // ============================================================

    function scrollToLatest() {

      window.setTimeout(
        () => {

          window.scrollTo({

            top:
              document.body.scrollHeight,

            behavior:
              "smooth",
          });

        },

        50
      );
    }


    function addMessage(
      role,
      text
    ) {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        `message-row ${role}`;


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "bubble";


      bubble.textContent =
        text;


      row.appendChild(
        bubble
      );


      chatArea.appendChild(
        row
      );


      scrollToLatest();


      return row;
    }


    function addUserImageMessage(
      previewUrl,
      text
    ) {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "message-row user";


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "bubble";


      const img =
        document.createElement(
          "img"
        );


      img.className =
        "message-image";


      img.src =
        previewUrl;


      img.alt =
        "學生上傳的題目";


      bubble.appendChild(
        img
      );


      if (
        text
      ) {

        const caption =
          document.createElement(
            "div"
          );


        caption.className =
          "image-caption";


        caption.textContent =
          text;


        bubble.appendChild(
          caption
        );
      }


      row.appendChild(
        bubble
      );


      chatArea.appendChild(
        row
      );


      scrollToLatest();


      return row;
    }


    function addThinkingMessage() {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "message-row ai";


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "bubble";


      const thinking =
        document.createElement(
          "div"
        );


      thinking.className =
        "thinking";


      const label =
        document.createElement(
          "span"
        );


      label.textContent =
        currentConversationId
          ? "AI 正在接著想"
          : "AI 正在看題";


      thinking.appendChild(
        label
      );


      for (
        let i = 0;
        i < 3;
        i++
      ) {

        const dot =
          document.createElement(
            "span"
          );


        dot.className =
          "thinking-dot";


        thinking.appendChild(
          dot
        );
      }


      bubble.appendChild(
        thinking
      );


      row.appendChild(
        bubble
      );


      chatArea.appendChild(
        row
      );


      scrollToLatest();


      return row;
    }


    // ============================================================
    // FETCH
    // ============================================================

    async function postJson(
      url,
      body,
      actionName
    ) {

      const response =
        await fetch(
          url,
          {
            method:
              "POST",

            headers: {

              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_PUBLISHABLE_KEY,

              "Authorization":
                `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
            },

            body:
              JSON.stringify(
                body
              ),
          }
        );


      const responseText =
        await response.text();


      let result;


      try {

        result =
          JSON.parse(
            responseText
          );

      } catch {

        throw new Error(
          `${actionName}後端回傳不是有效 JSON。HTTP ${response.status}`
        );
      }


      if (
        !response.ok ||
        result.success !== true
      ) {

        throw new Error(
          result.message ||
          result.error ||
          `${actionName}失敗，HTTP ${response.status}`
        );
      }


      return result;
    }


    // ============================================================
    // USER
    // ============================================================

    async function loadAskAiUser(
      idToken
    ) {

      const result =
        await postJson(

          GET_ASK_AI_USER_URL,

          {

              idToken,
          },

          "身份確認"
        );


      return result.user;
    }


    // ============================================================
    // ASK AI
    // ============================================================

    async function askAi(
      text,
      image,
      conversationId
    ) {

      if (
        !currentIdToken
      ) {

        throw new Error(
          "LINE 身份資訊已失效，請重新開啟頁面。"
        );
      }


      const payload = {

        id_token:
          currentIdToken,

        message:
          text || "",
      };


      if (
        conversationId
      ) {

        payload.conversation_id =
          conversationId;
      }


      if (
        image
      ) {

        payload.image_base64 =
          image.base64;


        payload.image_mime_type =
          image.mimeType;
      }


      return await postJson(

        ASK_AI_URL,

        payload,

        "問 AI"
      );
    }

    // ============================================================
    // HANDLE IMAGE
    // ============================================================

    async function handleSelectedImage(
      file
    ) {

      if (
        !ALLOWED_IMAGE_TYPES.includes(
          file.type
        )
      ) {

        throw new Error(
          "只支援 JPG、PNG、WEBP 圖片。"
        );
      }


      if (
        file.size >
        MAX_ORIGINAL_IMAGE_BYTES
      ) {

        throw new Error(
          "原始圖片太大，請換一張較小的圖片。"
        );
      }


      showStatus(
        "正在壓縮題目圖片……"
      );


      const compressed =
        await compressImage(
          file
        );


      if (
        compressed.blob.size >
        MAX_COMPRESSED_IMAGE_BYTES
      ) {

        throw new Error(
          "圖片壓縮後仍超過 3 MB，請重新拍近一點或裁掉不需要的部分。"
        );
      }


      const base64 =
        await blobToBase64(
          compressed.blob
        );


      clearSelectedImage();


      const previewUrl =
        URL.createObjectURL(
          compressed.blob
        );


      selectedImage = {

        fileName:
          file.name ||
          "question.jpg",

        mimeType:
          "image/jpeg",

        originalBytes:
          file.size,

        compressedBytes:
          compressed.blob.size,

        width:
          compressed.width,

        height:
          compressed.height,

        blob:
          compressed.blob,

        base64:
          base64,

        previewUrl:
          previewUrl,
      };


      imagePreview.src =
        previewUrl;


      imagePreviewArea.classList.add(
        "visible"
      );


      imageInfo.textContent =
        [
          `${compressed.width} × ${compressed.height}`,

          formatBytes(
            compressed.blob.size
          ),
        ].join("｜");


      restoreConnectedStatus();


      enableComposer();
    }


    // ============================================================
    // COMPRESS
    // ============================================================

    async function compressImage(
      file
    ) {

      try {

        const bitmap =
          await createImageBitmap(
            file
          );


        const resized =
          calculateResizedDimensions(

            bitmap.width,

            bitmap.height
          );


        const canvas =
          document.createElement(
            "canvas"
          );


        canvas.width =
          resized.width;


        canvas.height =
          resized.height;


        const ctx =
          canvas.getContext(
            "2d"
          );


        if (
          !ctx
        ) {

          bitmap.close();

          throw new Error(
            "手機無法建立圖片處理畫布。"
          );
        }


        ctx.fillStyle =
          "#ffffff";


        ctx.fillRect(

          0,

          0,

          resized.width,

          resized.height
        );


        ctx.drawImage(

          bitmap,

          0,

          0,

          resized.width,

          resized.height
        );


        bitmap.close();


        const blob =
          await canvasToJpegBlob(
            canvas
          );


        return {

          blob,

          width:
            resized.width,

          height:
            resized.height,
        };


      } catch {

        return await compressImageWithHtmlImage(
          file
        );
      }
    }


    async function compressImageWithHtmlImage(
      file
    ) {

      const objectUrl =
        URL.createObjectURL(
          file
        );


      try {

        const img =
          await new Promise(
            (resolve, reject) => {

              const element =
                new Image();


              element.onload =
                () => resolve(
                  element
                );


              element.onerror =
                () => reject(
                  new Error(
                    "圖片讀取失敗。"
                  )
                );


              element.src =
                objectUrl;
            }
          );


        const resized =
          calculateResizedDimensions(

            img.naturalWidth,

            img.naturalHeight
          );


        const canvas =
          document.createElement(
            "canvas"
          );


        canvas.width =
          resized.width;


        canvas.height =
          resized.height;


        const ctx =
          canvas.getContext(
            "2d"
          );


        if (
          !ctx
        ) {

          throw new Error(
            "手機無法建立圖片處理畫布。"
          );
        }


        ctx.fillStyle =
          "#ffffff";


        ctx.fillRect(

          0,

          0,

          resized.width,

          resized.height
        );


        ctx.drawImage(

          img,

          0,

          0,

          resized.width,

          resized.height
        );


        const blob =
          await canvasToJpegBlob(
            canvas
          );


        return {

          blob,

          width:
            resized.width,

          height:
            resized.height,
        };


      } finally {

        URL.revokeObjectURL(
          objectUrl
        );
      }
    }


    function calculateResizedDimensions(
      originalWidth,
      originalHeight
    ) {

      let width =
        Number(
          originalWidth
        );


      let height =
        Number(
          originalHeight
        );


      if (
        !width ||
        !height
      ) {

        throw new Error(
          "無法讀取圖片尺寸。"
        );
      }


      const longSide =
        Math.max(
          width,
          height
        );


      if (
        longSide <=
        MAX_IMAGE_LONG_SIDE
      ) {

        return {
          width,
          height,
        };
      }


      const ratio =
        MAX_IMAGE_LONG_SIDE /
        longSide;


      return {

        width:
          Math.round(
            width *
            ratio
          ),

        height:
          Math.round(
            height *
            ratio
          ),
      };
    }


    function canvasToJpegBlob(
      canvas
    ) {

      return new Promise(
        (resolve, reject) => {

          canvas.toBlob(

            (result) => {

              if (
                !result
              ) {

                reject(
                  new Error(
                    "圖片壓縮失敗。"
                  )
                );

                return;
              }


              resolve(
                result
              );
            },

            "image/jpeg",

            JPEG_QUALITY
          );
        }
      );
    }


    function blobToBase64(
      blob
    ) {

      return new Promise(
        (resolve, reject) => {

          const reader =
            new FileReader();


          reader.onload =
            () => {

              const result =
                String(
                  reader.result ||
                  ""
                );


              const commaIndex =
                result.indexOf(
                  ","
                );


              if (
                commaIndex ===
                -1
              ) {

                reject(
                  new Error(
                    "圖片轉換失敗。"
                  )
                );

                return;
              }


              resolve(
                result.slice(
                  commaIndex + 1
                )
              );
            };


          reader.onerror =
            () => {

              reject(
                new Error(
                  "圖片讀取失敗。"
                )
              );
            };


          reader.readAsDataURL(
            blob
          );
        }
      );
    }


    function formatBytes(
      bytes
    ) {

      const value =
        Number(
          bytes ||
          0
        );


      if (
        !Number.isFinite(
          value
        ) ||
        value <= 0
      ) {

        return "0 B";
      }


      if (
        value <
        1024
      ) {

        return `${Math.round(value)} B`;
      }


      if (
        value <
        1024 * 1024
      ) {

        return `${(
          value /
          1024
        ).toFixed(0)} KB`;
      }


      return `${(
        value /
        1024 /
        1024
      ).toFixed(2)} MB`;
    }


    // ============================================================
    // IMAGE CLEAR
    // ============================================================

    function clearSelectedImage() {

      if (
        selectedImage?.previewUrl
      ) {

        URL.revokeObjectURL(
          selectedImage.previewUrl
        );
      }


      selectedImage =
        null;


      imagePreview.src =
        "";


      imagePreviewArea.classList.remove(
        "visible"
      );


      imageInfo.textContent =
        "";


      fileInput.value =
        "";
    }


    function clearSelectedImageAfterSend() {

      selectedImage =
        null;


      imagePreview.src =
        "";


      imagePreviewArea.classList.remove(
        "visible"
      );


      imageInfo.textContent =
        "";


      fileInput.value =
        "";
    }

    // ============================================================
    // LIFF INIT
    // ============================================================

    async function initializeLiff() {

      disableComposer(
        "正在確認身份……"
      );


      if (
        !window.liff
      ) {

        showStatus(
          "LIFF SDK 載入失敗",
          true
        );


        return;
      }


      try {

        await liff.init({

          liffId:
            LIFF_ID,
        });


        if (
          !liff.isLoggedIn()
        ) {

          showStatus(
            "正在登入 LINE……"
          );


          liff.login();


          return;
        }


        currentIdToken =
          liff.getIDToken();


        if (
          !currentIdToken
        ) {

          throw new Error(
            "無法取得 LINE ID Token"
          );
        }


        showStatus(
          "正在確認使用者身份……"
        );


        currentUser =
          await loadAskAiUser(
            currentIdToken
          );


        restoreConnectedStatus();


        setConversationId(
          null
        );


        enableComposer();


      } catch (error) {

        console.error(
          "Ask AI 初始化失敗：",
          error
        );


        currentUser =
          null;


        currentIdToken =
          null;


        showStatus(
          `身份確認失敗：${
            error instanceof Error
              ? error.message
              : String(error)
          }`,
          true
        );


        disableComposer(
          "身份確認失敗"
        );
      }
    }


    // ============================================================
    // SEND
    // ============================================================

    async function sendMessage() {

      if (
        requestInProgress
      ) {

        return;
      }


      if (
        !currentUser ||
        !currentIdToken
      ) {

        alert(
          "尚未完成身份確認。"
        );


        return;
      }


      const text =
        questionInput
          .value
          .trim();


      if (
        !text &&
        !selectedImage
      ) {

        return;
      }


      if (
        text.length >
        1200
      ) {

        alert(
          "一次最多輸入 1200 個字元，請把問題縮短一點。"
        );


        return;
      }


      const conversationSnapshot =
        currentConversationId;


      const imageSnapshot =
        selectedImage
          ? {
              ...selectedImage
            }
          : null;


      // ==========================================================
      // USER BUBBLE
      // ==========================================================

      if (
        imageSnapshot
      ) {

        chatImageUrls.push(
          imageSnapshot.previewUrl
        );


        addUserImageMessage(

          imageSnapshot.previewUrl,

          text
        );


        clearSelectedImageAfterSend();

      } else {

        addMessage(
          "user",
          text
        );
      }


      questionInput.value =
        "";


      hideIntroCard();


      const thinkingRow =
        addThinkingMessage();


      setSendingState(
        true
      );


      try {

        // ========================================================
        // SEND CURRENT CONVERSATION ID
        // ========================================================

        const result =
          await askAi(

            text,

            imageSnapshot,

            conversationSnapshot
          );


        thinkingRow.remove();


        const answer =
          String(
            result.answer ||
            ""
          ).trim();


        if (
          !answer
        ) {

          throw new Error(
            "AI 沒有回傳答案。"
          );
        }


        addMessage(
          "ai",
          answer
        );


        // ========================================================
        // SAVE RETURNED CONVERSATION ID
        // ========================================================

        if (
          result.conversation_active ===
            true &&
          result.conversation_id
        ) {

          setConversationId(
            result.conversation_id
          );

        } else {

          // rejected / unreadable 等结果不继续 conversation
          setConversationId(
            null
          );
        }


        console.log(
          "Ask AI response:",
          result
        );


        console.log(
          "Conversation ID:",
          result.conversation_id
        );


        console.log(
          "Interaction ID:",
          result.interaction_id
        );


      } catch (error) {

        thinkingRow.remove();


        console.error(
          "Ask AI error:",
          error
        );


        addMessage(
          "system",
          `這次沒有成功：${
            error instanceof Error
              ? error.message
              : String(error)
          }`
        );


      } finally {

        setSendingState(
          false
        );
      }
    }


    // ============================================================
    // INTRO
    // ============================================================

    function hideIntroCard() {

      if (
        !introCard ||
        introCard.dataset.hidden
      ) {

        return;
      }


      introCard.style.display =
        "none";


      introCard.dataset.hidden =
        "true";
    }


    // ============================================================
    // EVENTS
    // ============================================================

    sendButton.addEventListener(
      "click",
      sendMessage
    );


    questionInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key ===
          "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();


          sendMessage();
        }
      }
    );


    window.addEventListener(
      "DOMContentLoaded",
      initializeLiff
    );


    window.addEventListener(
      "beforeunload",
      () => {

        if (
          selectedImage?.previewUrl
        ) {

          URL.revokeObjectURL(
            selectedImage.previewUrl
          );
        }


        for (
          const url of
          chatImageUrls
        ) {

          try {

            URL.revokeObjectURL(
              url
            );

          } catch {
            // ignore
          }
        }
      }
    );

  </script>
