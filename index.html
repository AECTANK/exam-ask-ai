<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  />

  <title>會考問 AI</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --primary: #07966c;
      --primary-dark: #067a59;

      --background: #f3f6fb;
      --card: #ffffff;

      --text: #172033;
      --muted: #667085;

      --border: #d9e0ea;

      --user-bubble: #dcf7ec;
      --ai-bubble: #ffffff;

      --soft-green: #edf9f5;

      --danger: #c62828;
    }

    * {
      box-sizing: border-box;
      -webkit-text-size-adjust: 100%;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: var(--background);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang TC",
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    /* ============================================================
       PAGE
    ============================================================ */

    .page {
      width: 100%;
      max-width: 760px;
      min-height: 100vh;

      margin: 0 auto;

      padding:
        calc(18px + env(safe-area-inset-top))
        16px
        calc(100px + env(safe-area-inset-bottom));
    }


    /* ============================================================
       HEADER
    ============================================================ */

    .header {
      margin-bottom: 14px;
    }

    .header-title {
      margin: 0;

      font-size: 25px;
      line-height: 1.3;
      font-weight: 850;

      letter-spacing: 0.2px;
    }

    .header-subtitle {
      margin-top: 5px;

      color: var(--muted);

      font-size: 14px;
      line-height: 1.5;
      font-weight: 600;
    }


    /* ============================================================
       INTRO CARD
    ============================================================ */

    .intro-card {
      margin-bottom: 20px;

      padding: 18px;

      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 18px;

      box-shadow:
        0 6px 20px rgba(30, 50, 80, 0.06);
    }

    .intro-title {
      margin: 0 0 14px;

      font-size: 18px;
      line-height: 1.4;
      font-weight: 800;
    }

    .intro-actions {
      display: grid;
      gap: 10px;
    }

    .intro-action {
      display: flex;
      align-items: center;
      gap: 11px;

      min-height: 46px;

      padding: 10px 12px;

      background: #f7f9fc;

      border: 1px solid #e4e9f0;
      border-radius: 12px;
    }

    .intro-action-icon {
      flex: 0 0 30px;

      font-size: 21px;
      text-align: center;
    }

    .intro-action-text {
      font-size: 15px;
      line-height: 1.45;
      font-weight: 700;
    }


    /* ============================================================
       SUBJECT TAGS
    ============================================================ */

    .subject-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;

      margin-top: 14px;
    }

    .subject-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 29px;

      padding: 5px 10px;

      background: var(--soft-green);

      border: 1px solid #cceee2;
      border-radius: 999px;

      color: #087456;

      font-size: 13px;
      line-height: 1;
      font-weight: 750;
    }

    .intro-tip {
      margin-top: 13px;

      padding-top: 12px;

      border-top: 1px solid #edf0f4;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.5;
    }


    /* ============================================================
       CHAT AREA
    ============================================================ */

    .chat-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message-row {
      display: flex;
      width: 100%;
    }

    .message-row.ai {
      justify-content: flex-start;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 84%;

      padding: 12px 14px;

      border-radius: 16px;

      font-size: 15px;
      line-height: 1.65;

      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message-row.ai .bubble {
      background: var(--ai-bubble);

      border: 1px solid var(--border);

      border-top-left-radius: 6px;
    }

    .message-row.user .bubble {
      background: var(--user-bubble);

      border: 1px solid #b7ead7;

      border-top-right-radius: 6px;
    }


    /* ============================================================
       STATUS
    ============================================================ */

    .status {
      margin-top: 14px;

      color: #98a2b3;

      font-size: 11px;
      line-height: 1.5;
      text-align: center;
    }

    .status.error {
      color: var(--danger);
      font-weight: 700;
    }


    /* ============================================================
       COMPOSER
    ============================================================ */

    .composer {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 0;

      z-index: 100;

      padding:
        9px
        12px
        calc(9px + env(safe-area-inset-bottom));

      background: rgba(255, 255, 255, 0.97);

      border-top: 1px solid var(--border);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .composer-inner {
      display: flex;
      align-items: flex-end;
      gap: 8px;

      width: 100%;
      max-width: 760px;

      margin: 0 auto;
    }


    /* ============================================================
       IMAGE BUTTON
    ============================================================ */

    .image-button {
      flex: 0 0 48px;

      width: 48px;
      height: 48px;

      border: 0;
      border-radius: 14px;

      background: #eef1f5;

      font-size: 21px;

      cursor: pointer;
    }

    .image-button:active {
      transform: scale(0.96);
    }

    .image-button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }


    /* ============================================================
       INPUT
    ============================================================ */

    .input-wrap {
      flex: 1;
    }

    .question-input {
      display: block;

      width: 100%;

      min-height: 48px;
      max-height: 120px;

      padding: 12px 14px;

      resize: none;

      background: #ffffff;

      border: 1.5px solid #b8c3d1;
      border-radius: 14px;

      outline: none;

      color: var(--text);

      font-family: inherit;
      font-size: 16px;
      line-height: 1.4;
    }

    .question-input:focus {
      border-color: var(--primary);
    }

    .question-input::placeholder {
      color: #98a2b3;
    }

    .question-input:disabled {
      background: #eef1f5;
      color: #98a2b3;
      cursor: not-allowed;
    }


    /* ============================================================
       SEND BUTTON
    ============================================================ */

    .send-button {
      flex: 0 0 48px;

      width: 48px;
      height: 48px;

      border: 0;
      border-radius: 14px;

      background: var(--primary);

      color: #ffffff;

      font-size: 21px;
      font-weight: 850;

      cursor: pointer;
    }

    .send-button:hover {
      background: var(--primary-dark);
    }

    .send-button:active {
      transform: scale(0.96);
    }

    .send-button:disabled {
      background: #a8b3c5;
      cursor: not-allowed;
    }


    /* ============================================================
       MOBILE
    ============================================================ */

    @media (max-width: 480px) {

      .page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .header-title {
        font-size: 24px;
      }

      .intro-card {
        padding: 16px;
      }

      .intro-title {
        font-size: 17px;
      }

      .intro-action-text {
        font-size: 14px;
      }

      .bubble {
        max-width: 88%;
        font-size: 15px;
      }
    }
  </style>
</head>


<body>

  <main class="page">

    <!-- ========================================================
         HEADER
    ========================================================= -->

    <header class="header">

      <h1 class="header-title">
        🤖 會考問 AI
      </h1>

      <div class="header-subtitle">
        國中 7～9 年級五科專用
      </div>

    </header>


    <!-- ========================================================
         INTRO
    ========================================================= -->

    <section class="intro-card">

      <div class="intro-title">
        有題目就丟給我吧！ 👋
      </div>


      <div class="intro-actions">

        <div class="intro-action">

          <div class="intro-action-icon">
            📷
          </div>

          <div class="intro-action-text">
            拍照或從相簿上傳題目
          </div>

        </div>


        <div class="intro-action">

          <div class="intro-action-icon">
            ⌨️
          </div>

          <div class="intro-action-text">
            直接輸入文字提問
          </div>

        </div>

      </div>


      <div class="subject-list">

        <span class="subject-tag">國文</span>
        <span class="subject-tag">英文</span>
        <span class="subject-tag">數學</span>
        <span class="subject-tag">自然</span>
        <span class="subject-tag">社會</span>

      </div>


      <div class="intro-tip">
        💡 一次問一題，題目拍清楚，我會看得更準。
      </div>

    </section>


    <!-- ========================================================
         CHAT
    ========================================================= -->

    <section
      id="chatArea"
      class="chat-area"
    ></section>


    <div
      id="statusText"
      class="status"
    >
      正在初始化 LIFF……
    </div>

  </main>


  <!-- ==========================================================
       INPUT BAR
  =========================================================== -->

  <div class="composer">

    <div class="composer-inner">


      <button
        id="imageButton"
        class="image-button"
        type="button"
        aria-label="拍照或上傳圖片"
        title="拍照或上傳圖片"
        disabled
      >
        📷
      </button>


      <div class="input-wrap">

        <textarea
          id="questionInput"
          class="question-input"
          rows="1"
          maxlength="1000"
          placeholder="正在確認身份……"
          disabled
        ></textarea>

      </div>


      <button
        id="sendButton"
        class="send-button"
        type="button"
        aria-label="送出"
        disabled
      >
        ➤
      </button>


    </div>

  </div>


  <script>
    "use strict";


    // ============================================================
    // LIFF
    // ============================================================

    const LIFF_ID =
      "2011171161-2TM6bcRg";


    // ============================================================
    // SUPABASE
    // ============================================================

    const GET_ASK_AI_USER_URL =
      "https://xbitdnrjiqlosfkzegiz.supabase.co/functions/v1/get-ask-ai-user";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_VtPQzTC8Cw-ccxC5bSzIuw_nHVbTO3Q";


    // ============================================================
    // STATE
    // ============================================================

    let liffReady = false;
    let currentUser = null;


    // ============================================================
    // DOM
    // ============================================================

    const chatArea =
      document.getElementById("chatArea");

    const questionInput =
      document.getElementById("questionInput");

    const sendButton =
      document.getElementById("sendButton");

    const imageButton =
      document.getElementById("imageButton");

    const statusText =
      document.getElementById("statusText");


    // ============================================================
    // UI STATE
    // ============================================================

    function enableComposer() {

      questionInput.disabled = false;
      sendButton.disabled = false;
      imageButton.disabled = false;

      questionInput.placeholder =
        "輸入你的問題……";
    }


    function disableComposer(message) {

      questionInput.disabled = true;
      sendButton.disabled = true;
      imageButton.disabled = true;

      questionInput.placeholder =
        message || "目前無法使用";
    }


    function showStatus(message, isError = false) {

      statusText.textContent = message;

      statusText.classList.toggle(
        "error",
        isError
      );
    }


    // ============================================================
    // CHAT UI
    // ============================================================

    function addMessage(role, text) {

      const row =
        document.createElement("div");

      row.className =
        `message-row ${role}`;


      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";

      bubble.textContent =
        text;


      row.appendChild(bubble);

      chatArea.appendChild(row);


      window.setTimeout(() => {

        row.scrollIntoView({
          behavior: "smooth",
          block: "nearest",
        });

      }, 50);
    }


    // ============================================================
    // GET ASK AI USER
    // ============================================================

    async function loadAskAiUser(idToken) {

      const response = await fetch(
        GET_ASK_AI_USER_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_PUBLISHABLE_KEY,

            "Authorization":
              `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,
          },

          body: JSON.stringify({
            id_token: idToken,
          }),
        }
      );


      const responseText =
        await response.text();


      let result;


      try {

        result =
          JSON.parse(responseText);

      } catch {

        throw new Error(
          [
            "身份後端回傳不是有效 JSON。",
            "",
            `HTTP：${response.status}`,
            "",
            responseText.slice(0, 800),
          ].join("\n")
        );
      }


      if (
        !response.ok ||
        result.success !== true
      ) {

        throw new Error(
          result.message ||
          result.error ||
          `身份確認失敗，HTTP ${response.status}`
        );
      }


      return result.user;
    }


    // ============================================================
    // LIFF INITIALIZATION
    // ============================================================

    async function initializeLiff() {

      disableComposer(
        "正在確認身份……"
      );


      if (!window.liff) {

        showStatus(
          "LIFF SDK 載入失敗",
          true
        );

        return;
      }


      try {

        // ----------------------------------------------------------
        // 1. 初始化 LIFF
        // ----------------------------------------------------------

        await liff.init({
          liffId: LIFF_ID,
        });


        liffReady = true;


        // ----------------------------------------------------------
        // 2. 確認 LINE Login
        // ----------------------------------------------------------

        if (!liff.isLoggedIn()) {

          showStatus(
            "正在登入 LINE……"
          );

          liff.login();

          return;
        }


        // ----------------------------------------------------------
        // 3. 取得 ID Token
        // ----------------------------------------------------------

        const idToken =
          liff.getIDToken();


        if (!idToken) {

          throw new Error(
            "無法取得 LINE ID Token"
          );
        }


        showStatus(
          "正在確認使用者身份……"
        );


        // ----------------------------------------------------------
        // 4. Edge 驗證 LINE 身份 + 查 students
        // ----------------------------------------------------------

        currentUser =
          await loadAskAiUser(
            idToken
          );


        // ----------------------------------------------------------
        // 5. 顯示身份
        // ----------------------------------------------------------

        const roleText =
          currentUser.role === "teacher"
            ? "老師"
            : "學生";


        const displayName =
          currentUser.nickname ||
          currentUser.full_name ||
          "使用者";


        showStatus(
          `LIFF 已連線｜${roleText}：${displayName}`
        );


        console.log(
          "Ask AI user:",
          currentUser
        );


        // ----------------------------------------------------------
        // 6. 身份成功後才開放輸入
        // ----------------------------------------------------------

        enableComposer();


      } catch (error) {

        liffReady = false;
        currentUser = null;


        console.error(
          "Ask AI 身份初始化失敗：",
          error
        );


        const message =
          error instanceof Error
            ? error.message
            : String(error);


        showStatus(
          `身份確認失敗：${message}`,
          true
        );


        disableComposer(
          "身份確認失敗"
        );
      }
    }


    // ============================================================
    // TEST SEND
    // ============================================================

    function sendTestMessage() {

      if (!currentUser) {

        alert(
          "尚未完成身份確認。"
        );

        return;
      }


      const text =
        questionInput.value.trim();


      if (!text) {
        return;
      }


      addMessage(
        "user",
        text
      );


      questionInput.value = "";


      window.setTimeout(() => {

        addMessage(
          "ai",
          "這裡目前是 UI 測試版。身份驗證已經接通；下一步接上 ask-ai Edge Function 後，我就會真的回答你。"
        );

      }, 350);
    }


    sendButton.addEventListener(
      "click",
      sendTestMessage
    );


    questionInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendTestMessage();
        }
      }
    );


    // ============================================================
    // IMAGE TEST
    // ============================================================

    imageButton.addEventListener(
      "click",
      () => {

        if (!currentUser) {

          alert(
            "尚未完成身份確認。"
          );

          return;
        }


        alert(
          "圖片功能下一階段會支援：\n\n📷 直接拍照\n🖼️ 從相簿選擇題目"
        );

      }
    );


    // ============================================================
    // START
    // ============================================================

    window.addEventListener(
      "DOMContentLoaded",
      initializeLiff
    );

  </script>

</body>
</html>
